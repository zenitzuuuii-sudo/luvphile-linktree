<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<title>luvphile.exe</title>
<style>
:root{--bg:#0b1026;--card:#151a3a;--fg:#f3ecff;--mut:#b9aeff;--acc:#ff2f98;--dim:#2a3170;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
main{width:100%;max-width:900px;margin:0 auto;padding:64px 30px 72px}
.heart{display:block;margin:0 auto;width:190px;height:auto;fill:var(--acc);shape-rendering:crispEdges}
h1{font-size:clamp(30px,6vw,58px);letter-spacing:.01em;margin:30px 0 8px;text-align:center;line-height:1.15}
.t{color:var(--mut);text-align:center;margin:0 0 54px;font-size:clamp(14px,3vw,28px);line-height:1.45}
.w{background:var(--card);border:6px solid var(--acc)}
.b{background:var(--acc);color:var(--bg);font-weight:800;padding:18px 24px;font-size:clamp(16px,3.2vw,28px)}
.c{padding:48px 40px;text-align:center}
.c h2{margin:0 0 8px;font-size:clamp(24px,4.8vw,44px);line-height:1.2}
.c p{margin:0 0 34px;color:var(--mut);font-size:clamp(14px,3vw,25px);line-height:1.4}
.l{height:44px;border:4px solid var(--acc);padding:4px;margin-bottom:40px}
.l i{display:block;height:100%;width:60%;background:repeating-linear-gradient(90deg,var(--acc) 0 28px,transparent 28px 36px)}
a.p{display:block;background:var(--acc);color:var(--bg);text-decoration:none;font-weight:800;padding:28px 18px;font-size:clamp(18px,3.5vw,30px);transition:transform .15s,box-shadow .15s}
a.p:hover,a.p:focus-visible{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--fg);outline:none}
a.p:focus-visible{outline:3px dashed var(--fg);outline-offset:6px}
@media(max-width:520px){main{padding:48px 18px 56px}.heart{width:130px}h1{margin-top:22px}.t{margin-bottom:38px}.w{border-width:4px}.b{padding:13px 16px}.c{padding:30px 18px}.l{height:28px;border-width:3px;padding:3px;margin-bottom:26px}.l i{background:repeating-linear-gradient(90deg,var(--acc) 0 16px,transparent 16px 21px)}a.p{padding:20px 12px}}
</style>
</head>
<body>
<main>
<svg class="heart" viewBox="0 0 11 9" role="img" aria-label="Pixel heart"><rect x="2" y="0" width="2" height="1"/><rect x="7" y="0" width="2" height="1"/><rect x="1" y="1" width="4" height="1"/><rect x="6" y="1" width="4" height="1"/><rect x="0" y="2" width="11" height="2"/><rect x="1" y="4" width="9" height="1"/><rect x="2" y="5" width="7" height="1"/><rect x="3" y="6" width="5" height="1"/><rect x="4" y="7" width="3" height="1"/><rect x="5" y="8" width="1" height="1"/></svg>
<h1>luvphile.exe</h1>
<p class="t">songs for the feelings you can't explain</p>
<section class="w" aria-label="Playlist link">
<div class="b">playlist.exe</div>
<div class="c">
<h2>2AM PLAYLIST</h2>
<p>9 tracks // best with the volume up</p>
<div class="l" aria-hidden="true"><i></i></div>
<a class="p" href="https://open.spotify.com/playlist/3dAWzewFTNrYbRsDhidYTc" target="_blank" rel="noopener noreferrer">open on spotify</a>
</div>
</section>
</main>
</body>
</html>
